  infection_grp_gn_nonfermenters:   {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  infection_grp_clostridium:        {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  infection_grp_herpes_viruses:     {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  infection_grp_cmv:                {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  infection_grp_bkpyv:              {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
