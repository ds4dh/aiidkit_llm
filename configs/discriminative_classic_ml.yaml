  # infection_grp_influenza:          {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  # infection_grp_other_resp_viruses: {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  # infection_grp_sars_cov_2:         {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  # infection_grp_other_viruses:      {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  # infection_grp_candida:            {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
  # infection_grp_aspergillus:        {fups: [0, 30, 60, 90, 180, 360], horizons: [30, 60, 90]}
