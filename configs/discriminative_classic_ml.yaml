# Run parameters
data_dir: /home/shares/ds4dh/aiidkit_project/data_new/processed/v4.0/classic_ml
data_split_type: random_split  # random_split, center_split, temporal_split
result_dir: results/classic_ml
model_types: [logistic_regression, random_forest, xgboost]
prediction_tasks:
  # Synchronized 1-to-1 with the 13 canonical tasks and clinical horizons ([30, 60, 90] acute infections; [360, 720, 1800] long-term outcomes)
  infection_bacteria:             {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_enterobacterales: {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_gram_positive:    {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_gn_nonfermenters: {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_clostridium:      {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_virus:                {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_herpes_viruses:   {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_cmv:              {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_bkpyv:            {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_fungi:                {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  infection_grp_candida:          {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [30, 60, 90]}
  death:                          {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [360, 720, 1800]}
  graft_loss:                     {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [360, 720, 1800]}

# Columns to exclude from input features
ignore_columns:
  - "patientkey"
  - "patientid"
  - "obs_end_days"
  - "fup"
  - "split"
  - "label_*"

# Hyper parameters for all model types
train_data_augment: random  # random (continuous daily landmarks), all (30d grid), valid, none
target_undersampling_ratio: 15.0  # same as for transformer pipeline (undersample if worse than this ratio)
models:

  # Linear baseline
  logistic_regression:
    n_optuna_trials: 50
    optuna_params:
      C: ["float", 0.0001, 10.0, "log"]
      penalty: ["categorical", "l1", "l2"]
      feature_fraction: ["int", 25, 100]
      solver: "liblinear"
      tol: 0.001
      max_iter: 300
      random_state: 1234
    fixed_params:
      C: 1.0
      penalty: "l2"
      feature_fraction: 100

  # Non-linear baseline
  random_forest:
    n_optuna_trials: 50
    optuna_params:
      n_estimators: ["int", 100, 500]
      max_depth: ["int", 5, 30]
      min_samples_split: ["int", 2, 20]
      min_samples_leaf: ["int", 1, 10]
      max_features: ["categorical", "sqrt", "log2"]
      feature_fraction: ["int", 25, 100]
      n_jobs: -1
      random_state: 1234
    fixed_params:
      n_estimators: 200
      max_depth: 15
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: "sqrt"
      feature_fraction: 100

  # State-of-the-art baseline with tabular data
  xgboost:
    n_optuna_trials: 50
    optuna_params:
      learning_rate: ["float", 0.005, 0.2, "log"]
      n_estimators: ["int", 100, 500]
      max_depth: ["int", 3, 8]
      subsample: ["float", 0.6, 1.0]
      colsample_bytree: ["float", 0.5, 1.0]
      min_child_weight: ["int", 1, 10]
      gamma: ["float", 0.0, 5.0]
      feature_fraction: ["int", 25, 100]
      n_jobs: -1
      eval_metric: "logloss"
      random_state: 1234
    fixed_params:
      learning_rate: 0.05
      n_estimators: 200
      max_depth: 5
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 0.1
      feature_fraction: 100