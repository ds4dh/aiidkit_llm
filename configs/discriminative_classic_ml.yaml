# Columns to exclude from input features
ignore_columns:
  - "patientkey"
  - "patientid"
  - "obs_end_days"
  - "fup"
  - "split"
  - "label_*"

# Hyper parameters for all model types
train_data_augment: all  # none, valid, all
target_undersampling_ratio: 15.0  # same as for transformer pipeline (undersample if worse than this ratio)
models:

  # Linear baseline
  logistic_regression:
    n_optuna_trials: 50
    optuna_params:
      C: ["float", 0.0001, 100.0, "log"]
      penalty: ["categorical", "l1", "l2"]
      feature_fraction: ["int", 25, 100]
      solver: "liblinear"
      max_iter: 1000
      n_jobs: -1
    fixed_params:
      C: 1.0
      penalty: "l2"
      feature_fraction: 100

  # Non-linear baseline
  random_forest:
    n_optuna_trials: 50
    optuna_params:
      n_estimators: ["int", 100, 500]
      max_depth: ["int", 5, 30]
      min_samples_split: ["int", 2, 20]
      min_samples_leaf: ["int", 1, 10]
      max_features: ["categorical", "sqrt", "log2"]
      feature_fraction: ["int", 25, 100]
      n_jobs: -1
    fixed_params:
      n_estimators: 200
      max_depth: 15
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: "sqrt"
      feature_fraction: 100

  # State-of-the-art baseline with tabular data
  xgboost:
    n_optuna_trials: 50
    optuna_params:
      learning_rate: ["float", 0.005, 0.2, "log"]
      n_estimators: ["int", 100, 500]
      max_depth: ["int", 3, 8]
      subsample: ["float", 0.6, 1.0]
      colsample_bytree: ["float", 0.5, 1.0]
      min_child_weight: ["int", 1, 10]
      gamma: ["float", 0.0, 5.0]
      feature_fraction: ["int", 25, 100]
      n_jobs: -1
      eval_metric: "logloss"
    fixed_params:
      learning_rate: 0.05
      n_estimators: 200
      max_depth: 5
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 0.1
      feature_fraction: 100