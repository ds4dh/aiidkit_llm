# =============================================================================
# Compact t-EAV ModernBERT Configuration (8L x 384d, ~15.5M params)
#
# Right-sized for ~2,330 unique transplant patients (~7.5x fewer parameters
# than ModernBERT-base's ~115M) while keeping full static conditioning,
# continuous numerical embeddings, global 1:15 undersampling (matching LR),
# inverse-sqrt patient-length weighting, and bottlenecked LandmarkSummaryEncoder.
# =============================================================================

run_id: e00-a15-v60_c8x384
data_dir: /home/shares/ds4dh/aiidkit_project/data_new/processed/v4.0/teav
data_split_type: random_split
result_dir: results/transformer

data_collator:
  eav_mappings:
    entity_id: entity
    attribute_id: attribute
    value_id: value_binned
  time_mapping:
    days_since_tpx: time
  mlm_label_keys:
    - entity_id
    - attribute_id
    - value_id
  mlm_masking_rules:
    entity_id: 0.00
    attribute_id: 0.15
    value_id: 0.60

# Fine-tuning sampling, weighting, and tabular anti-ablation regularization
train_data_augment: random
target_undersampling_ratio: 15.0  # global 1:15 undersampling (matches LR -> constant logit shift across FUPs)
undersampling_mode: global
patient_weight_alpha: 0.5         # w_p ~ n_frames(p)^(-0.5) to reduce 40x long-survivor dominance without label bias
landmark_bottleneck_dim: 128      # compact tabular branch (~0.35M params)
landmark_dropout: 0.25            # explicit tabular dropout decoupled from dropout_embedding=0.0
landmark_fup_gate: false          # set true for FUP-gated tabular fusion (sequence-led in POP, tabular-assisted in VLT)
drop_unlabeled: true
early_stopping_metric: roc_auc
early_stopping_subset: null
early_stopping_mean: random_effects
n_bootstrap_eval: 100

prediction_tasks:
  infection_bacteria: {fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600], horizons: [[30, 60, 90]]}
  multitask_bacteria:
    tasks: [
      infection_bacteria,
      infection_grp_enterobacterales,
      infection_grp_gram_positive,
      infection_grp_gn_nonfermenters,
      infection_grp_clostridium,
    ]
    fups: [0, 30, 60, 90, 120, 150, 180, 240, 300, 360, 540, 720, 900, 1080, 1440, 1800, 2700, 3600]
    horizons: [[30, 60, 90]]
  multitask_bv:
    tasks: [
      infection_bacteria,
