[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiidkit_llm"
version = "0.1.0"
description = "A project to train discriminative and generative LLMs to predict infections in post-transplant patient trajectories."
readme = "README.md"
authors = [{ name = "Alban Bornet", email = "alban.bornet@unige.ch" }]
license = { text = "MIT" }
dependencies = [
  # LLM stack
  "trl",
  "peft",
  "sentence-transformers",
  "captum",

  # Core science stack
  "numpy",
  "scipy",
  "scikit-learn",

  # RAPIDS GPU stack (CUDA 12 - Linux only)
  "cupy-cuda12x>=13.6.0; sys_platform == 'linux'",
  "treelite; sys_platform == 'linux'",
  "cudf-cu12==25.10.*; sys_platform == 'linux'",
  "cuml-cu12==25.10.*; sys_platform == 'linux'",

  # ML stack
  "xgboost",
  "umap-learn",
  "hdbscan; sys_platform == 'linux'",
  "imblearn",

  # Experiment / data / visualization
  "optuna",
  "pandas",
  "matplotlib",
  "plotly",
  "seaborn",
  "openpyxl",
  "kaleido",
  "tabulate",
  "adjustText",
  "lifelines",
  "statsmodels",
  "wandb",
  "tqdm",
]

[project.optional-dependencies]
dev = ["ipdb", "pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
